version: 2

models:
  - name: stg_raw_events
    description: "Normalized view over the versioned collector JSONL envelope."
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: schema_version
        tests:
          - not_null
          - accepted_values:
              values: ["1.0"]
      - name: occurred_at
        tests:
          - not_null
      - name: event_name
        tests:
          - not_null
      - name: service
        tests:
          - not_null

  - name: fct_orders
    description: "One outcome row per correlated Order API request."
    columns:
      - name: correlation_id
        tests:
          - not_null
          - unique
      - name: outcome
        tests:
          - accepted_values:
              values:
                - processed
                - payment_declined
                - inventory_rejected
                - product_not_found
                - inventory_service_error
                - inventory_unavailable
                - timeout
                - processing_error
                - failed
                - incomplete

  - name: fct_inventory_movements
    description: "Movement deltas derived from explicit Inventory API log events."
    columns:
      - name: movement_event_id
        tests:
          - not_null
          - unique
      - name: product_id
        tests:
          - not_null
      - name: movement_type
        tests:
          - accepted_values:
              values:
                - receipt
                - adjustment
                - reservation_created
                - reservation_released
                - reservation_committed

  - name: fct_order_generator_attempts
    description: "Individual requests emitted by the deterministic order generator."
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: correlation_id
        tests:
          - not_null
          - unique
      - name: run_id
        tests:
          - not_null

  - name: fct_order_generator_runs
    description: "Aggregate counters and latency statistics emitted by each run."
    columns:
      - name: run_id
        tests:
          - not_null
          - unique

  - name: fct_order_reconciliation
    description: "Compares each generator result with the Order API event-derived outcome."
    columns:
      - name: correlation_id
        tests:
          - not_null
          - unique
      - name: reconciliation_status
        tests:
          - accepted_values:
              values:
                - matched
                - missing_service_events
                - outcome_mismatch
