name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Verify committed lockfile
        run: uv lock --check --python 3.12
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Validate Compose and reproduction shell
        run: |
          bash -n scripts/reproduce-local.sh
          docker compose config --quiet
      - name: Run tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt analytics adapter
        run: python -m pip install --no-cache-dir -r analytics/requirements.txt
      - name: Build dbt analytics project
        working-directory: analytics
        env:
          DUCKDB_PATH: target/ci.duckdb
        run: dbt build --project-dir . --profiles-dir .
