name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Install dbt analytics adapter
        run: python -m pip install --no-cache-dir -r analytics/requirements.txt
      - name: Build dbt analytics project
        working-directory: analytics
        env:
          DUCKDB_PATH: target/ci.duckdb
        run: dbt build --project-dir . --profiles-dir .
