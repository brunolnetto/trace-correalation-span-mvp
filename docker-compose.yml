services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    command: ["start-dev", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/prepare-dev-env.sh before starting Compose}
    volumes:
      - keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:${KEYCLOAK_HOST_PORT:-18080}:8080"
    deploy:
      resources:
        limits:
          memory: 1G

  keycloak-config:
    image: quay.io/keycloak/keycloak:26.6.2
    entrypoint: ["/bin/bash", "/opt/keycloak/bootstrap/configure.sh"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/prepare-dev-env.sh before starting Compose}
      ORDER_API_CLIENT_SECRET: ${ORDER_API_CLIENT_SECRET:?Run scripts/prepare-dev-env.sh before starting Compose}
      INVENTORY_API_CLIENT_SECRET: ${INVENTORY_API_CLIENT_SECRET:?Run scripts/prepare-dev-env.sh before starting Compose}
      SUPPLIER_SIMULATOR_CLIENT_SECRET: ${SUPPLIER_SIMULATOR_CLIENT_SECRET:?Run scripts/prepare-dev-env.sh before starting Compose}
      EVENT_COLLECTOR_CLIENT_SECRET: ${EVENT_COLLECTOR_CLIENT_SECRET:?Run scripts/prepare-dev-env.sh before starting Compose}
      OUTBOX_DISPATCHER_CLIENT_SECRET: ${OUTBOX_DISPATCHER_CLIENT_SECRET:?Run scripts/prepare-dev-env.sh before starting Compose}
      ORDER_GENERATOR_CLIENT_SECRET: ${ORDER_GENERATOR_CLIENT_SECRET:?Run scripts/prepare-dev-env.sh before starting Compose}
      STANDALONE_RUNNER_CLIENT_SECRET: ${STANDALONE_RUNNER_CLIENT_SECRET:?Run scripts/prepare-dev-env.sh before starting Compose}
      LOCAL_DEVELOPER_CLIENT_SECRET: ${LOCAL_DEVELOPER_CLIENT_SECRET:?Run scripts/prepare-dev-env.sh before starting Compose}
    volumes:
      - ./docker/keycloak-configure.sh:/opt/keycloak/bootstrap/configure.sh:ro
    depends_on:
      keycloak:
        condition: service_started

x-oidc-env: &oidc-env
  AUTH_MODE: oidc
  OIDC_ISSUER: http://keycloak:8080/realms/trace-local
  OIDC_TOKEN_URL: http://keycloak:8080/realms/trace-local/protocol/openid-connect/token
  OIDC_INTROSPECTION_URL: http://keycloak:8080/realms/trace-local/protocol/openid-connect/token/introspect
  OIDC_TIMEOUT_SECONDS: "3"
  OIDC_INTROSPECTION_CACHE_SECONDS: "10"

  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_UI_HOST_PORT:-16686}:16686"
    deploy:
      resources:
        limits:
          memory: 512M

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./docker/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_HOST_PORT:-13100}:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3100/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.141.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_HOST_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_HEALTH_HOST_PORT:-13133}:13133"
    depends_on:
      jaeger:
        condition: service_started
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-13000}:3000"
    depends_on:
      loki:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  event-collector:
    build: .
    command:
      - uvicorn
      - app.event_collector.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8010"
    environment:
      <<: *oidc-env
      OIDC_AUDIENCE: event-collector
      OIDC_CLIENT_ID: event-collector
      OIDC_CLIENT_SECRET: ${EVENT_COLLECTOR_CLIENT_SECRET:?Run scripts/prepare-dev-env.sh before starting Compose}
      OIDC_SERVICE_SCOPES: "events:ingest"
      SERVICE_NAME: event-collector
      EVENT_STORE_PATH: /data/events.jsonl
      EVENT_QUARANTINE_PATH: /data/quarantine.jsonl
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      ENVIRONMENT: development
    volumes:
      - event-data:/data
    ports:
      - "127.0.0.1:${EVENT_COLLECTOR_HOST_PORT:-18003}:8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8010/healthz", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  outbox-dispatcher:
    build: .
    command:
      - uvicorn
      - app.outbox_dispatcher.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8011"
    environment:
      <<: *oidc-env
      OIDC_AUDIENCE: outbox-dispatcher
      OIDC_CLIENT_ID: outbox-dispatcher
      OIDC_CLIENT_SECRET: ${OUTBOX_DISPATCHER_CLIENT_SECRET:?Run scripts/prepare-dev-env.sh before starting Compose}
      OIDC_SERVICE_SCOPES: "events:ingest"
      SERVICE_NAME: outbox-dispatcher
      PERSISTENCE_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      DATABASE_POOL_MIN_SIZE: "1"
      DATABASE_POOL_MAX_SIZE: "5"
      EVENT_COLLECTOR_URL: http://event-collector:8010
      OUTBOX_BATCH_SIZE: "50"
      OUTBOX_LEASE_SECONDS: "30"
      OUTBOX_MAX_ATTEMPTS: "12"
      OUTBOX_BASE_BACKOFF_SECONDS: "1"
      OUTBOX_MAX_BACKOFF_SECONDS: "300"
      OUTBOX_POLL_INTERVAL_SECONDS: "0.5"
      OUTBOX_REQUEST_TIMEOUT_SECONDS: "5"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      ENVIRONMENT: development
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8011/healthz", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
      event-collector:
        condition: service_healthy
      postgres:
        condition: service_healthy

  inventory-api:
    build: .
    command: ["uvicorn", "app.inventory.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *oidc-env
      OIDC_AUDIENCE: inventory-api
      OIDC_CLIENT_ID: inventory-api
      OIDC_CLIENT_SECRET: ${INVENTORY_API_CLIENT_SECRET:?Run scripts/prepare-dev-env.sh before starting Compose}
      OIDC_SERVICE_SCOPES: "events:ingest"
      SERVICE_NAME: inventory-api
      EVENT_COLLECTOR_URL: http://event-collector:8010
      INVENTORY_SEED_DEMO_DATA: "true"
      PERSISTENCE_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      DATABASE_POOL_MIN_SIZE: "1"
      DATABASE_POOL_MAX_SIZE: "10"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      ENVIRONMENT: development
    ports:
      - "127.0.0.1:${INVENTORY_API_HOST_PORT:-18001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/healthz", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      event-collector:
        condition: service_healthy
      postgres:
        condition: service_healthy

  order-api:
    build: .
    command: ["uvicorn", "app.order.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *oidc-env
      OIDC_AUDIENCE: order-api
      OIDC_CLIENT_ID: order-api
      OIDC_CLIENT_SECRET: ${ORDER_API_CLIENT_SECRET:?Run scripts/prepare-dev-env.sh before starting Compose}
      OIDC_SERVICE_SCOPES: "catalog:read inventory:reserve inventory:fulfill events:ingest inventory:read"
      SERVICE_NAME: order-api
      EVENT_COLLECTOR_URL: http://event-collector:8010
      INVENTORY_API_URL: http://inventory-api:8001
      PERSISTENCE_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      DATABASE_POOL_MIN_SIZE: "1"
      DATABASE_POOL_MAX_SIZE: "10"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      ENVIRONMENT: development
    ports:
      - "127.0.0.1:${ORDER_API_HOST_PORT:-18000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      inventory-api:
        condition: service_healthy
      event-collector:
        condition: service_healthy
      postgres:
        condition: service_healthy

  supplier-simulator:
    build: .
    command:
      - uvicorn
      - app.supplier_simulator.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
    environment:
      <<: *oidc-env
      OIDC_AUDIENCE: supplier-simulator
      OIDC_CLIENT_ID: supplier-simulator
      OIDC_CLIENT_SECRET: ${SUPPLIER_SIMULATOR_CLIENT_SECRET:?Run scripts/prepare-dev-env.sh before starting Compose}
      OIDC_SERVICE_SCOPES: "catalog:read catalog:write inventory:read inventory:receive events:ingest"
      SERVICE_NAME: supplier-simulator
      EVENT_COLLECTOR_URL: http://event-collector:8010
      INVENTORY_API_URL: http://inventory-api:8001
      PERSISTENCE_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      DATABASE_POOL_MIN_SIZE: "1"
      DATABASE_POOL_MAX_SIZE: "10"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      ENVIRONMENT: development
    ports:
      - "127.0.0.1:${SUPPLIER_HOST_PORT:-18002}:8002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8002/healthz", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      inventory-api:
        condition: service_healthy
      event-collector:
        condition: service_healthy

  simulation-runner:
    build: .
    profiles: ["standalone"]
    command: ["python", "-m", "app.standalone_runner"]
    environment:
      <<: *oidc-env
      OIDC_AUDIENCE: inventory-api
      OIDC_CLIENT_ID: standalone-runner
      OIDC_CLIENT_SECRET: ${STANDALONE_RUNNER_CLIENT_SECRET:?Run scripts/prepare-dev-env.sh before starting Compose}
      OIDC_SERVICE_SCOPES: "catalog:read orders:process inventory:read inventory:reserve inventory:fulfill inventory:receive suppliers:read suppliers:manage suppliers:evaluate simulation:control events:ingest"
      ORDER_API_URL: http://order-api:8000
      INVENTORY_API_URL: http://inventory-api:8001
      SUPPLIER_API_URL: http://supplier-simulator:8002
      EVENT_COLLECTOR_URL: http://event-collector:8010
      SIMULATION_REPORT_PATH: /run-state/simulation-report.json
      SIMULATION_COLLECTOR_BARRIER_TIMEOUT_SECONDS: "30"
      SIMULATION_COLLECTOR_POLL_INITIAL_BACKOFF_SECONDS: "0.1"
      SIMULATION_COLLECTOR_POLL_MAX_BACKOFF_SECONDS: "2"
      SIMULATION_PRODUCT_ID: "7"
      SIMULATION_OPENING_STOCK: "42"
      SIMULATION_REORDER_POINT: "30"
      SIMULATION_TARGET_STOCK: "60"
      SIMULATION_LEAD_TIME_SECONDS: "3600"
      SIMULATION_FIRST_BATCH_COUNT: "8"
      SIMULATION_SECOND_BATCH_COUNT: "4"
      SIMULATION_ORDER_QUANTITY: "2"
      SIMULATION_SEED: "20261107"
    volumes:
      - run-state:/run-state
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
      order-api:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
      supplier-simulator:
        condition: service_healthy
      event-collector:
        condition: service_healthy
      outbox-dispatcher:
        condition: service_healthy

  order-generator:
    build: .
    profiles: ["simulation"]
    command: ["python", "-m", "app.order_generator"]
    environment:
      <<: *oidc-env
      OIDC_AUDIENCE: order-api
      OIDC_CLIENT_ID: order-generator
      OIDC_CLIENT_SECRET: ${ORDER_GENERATOR_CLIENT_SECRET:?Run scripts/prepare-dev-env.sh before starting Compose}
      OIDC_SERVICE_SCOPES: "orders:process events:ingest"
      ORDER_API_URL: http://order-api:8000
      EVENT_COLLECTOR_URL: http://event-collector:8010
      ORDER_GENERATOR_MODE: random
      ORDER_GENERATOR_COUNT: "10"
      ORDER_GENERATOR_SEED: "20261106"
      ORDER_GENERATOR_PRODUCT_ID: "7"
    depends_on:
      keycloak-config:
        condition: service_completed_successfully
      order-api:
        condition: service_healthy
      event-collector:
        condition: service_healthy

  analytics:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    profiles: ["analytics"]
    working_dir: /workspace
    environment:
      DUCKDB_PATH: /analytics-data/trace_events.duckdb
    command:
      - sh
      - -c
      - |
        if [ -s /raw/events.jsonl ]; then
          export RAW_EVENTS_PATH=/raw/events.jsonl
        fi
        dbt build --project-dir /workspace --profiles-dir /workspace
    volumes:
      - event-data:/raw:ro
      - analytics-data:/analytics-data
    depends_on:
      event-collector:
        condition: service_healthy

  analytics-runner:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    profiles: ["standalone"]
    working_dir: /workspace
    environment:
      SIMULATION_REPORT_PATH: /run-state/simulation-report.json
      RAW_EVENTS_PATH: /raw/events.jsonl
      DUCKDB_PATH: /analytics-data/trace_events.duckdb
      DBT_TARGET_PATH: /analytics-data/dbt-target
      ANALYTICS_REPORT_PATH: /analytics-data/run-report.json
      DBT_PROJECT_DIR: /workspace
      DBT_PROFILES_DIR: /workspace
      ANALYTICS_TIMEOUT_SECONDS: "3600"
    command: ["python", "/workspace/analytics_runner.py"]
    volumes:
      - event-data:/raw:ro
      - run-state:/run-state:ro
      - analytics-data:/analytics-data
    depends_on:
      event-collector:
        condition: service_healthy
      simulation-runner:
        condition: service_completed_successfully

volumes:
  keycloak-data:
  postgres-data:
  event-data:
  analytics-data:
  run-state:
  loki-data:
  grafana-data:
