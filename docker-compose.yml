services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_HOST_PORT:-16686}:16686"
      - "${OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "${OTLP_HTTP_HOST_PORT:-4318}:4318"

  event-collector:
    build: .
    command:
      - uvicorn
      - app.event_collector.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8010"
    environment:
      SERVICE_NAME: event-collector
      EVENT_STORE_PATH: /data/events.jsonl
      EVENT_QUARANTINE_PATH: /data/quarantine.jsonl
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      ENVIRONMENT: development
    volumes:
      - event-data:/data
    ports:
      - "127.0.0.1:18003:8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8010/healthz", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      jaeger:
        condition: service_started

  inventory-api:
    build: .
    command: ["uvicorn", "app.inventory.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      SERVICE_NAME: inventory-api
      EVENT_COLLECTOR_URL: http://event-collector:8010
      INVENTORY_SEED_DEMO_DATA: "true"
      PERSISTENCE_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      DATABASE_POOL_MIN_SIZE: "1"
      DATABASE_POOL_MAX_SIZE: "10"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      ENVIRONMENT: development
    ports:
      - "127.0.0.1:18001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/healthz", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      jaeger:
        condition: service_started
      event-collector:
        condition: service_healthy
      postgres:
        condition: service_healthy

  order-api:
    build: .
    command: ["uvicorn", "app.order.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_NAME: order-api
      EVENT_COLLECTOR_URL: http://event-collector:8010
      INVENTORY_API_URL: http://inventory-api:8001
      PERSISTENCE_BACKEND: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      DATABASE_POOL_MIN_SIZE: "1"
      DATABASE_POOL_MAX_SIZE: "10"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      ENVIRONMENT: development
    ports:
      - "127.0.0.1:18000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      jaeger:
        condition: service_started
      inventory-api:
        condition: service_healthy
      event-collector:
        condition: service_healthy
      postgres:
        condition: service_healthy

  supplier-simulator:
    build: .
    command:
      - uvicorn
      - app.supplier_simulator.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
    environment:
      SERVICE_NAME: supplier-simulator
      EVENT_COLLECTOR_URL: http://event-collector:8010
      INVENTORY_API_URL: http://inventory-api:8001
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      ENVIRONMENT: development
    ports:
      - "127.0.0.1:18002:8002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8002/healthz", timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      jaeger:
        condition: service_started
      inventory-api:
        condition: service_healthy
      event-collector:
        condition: service_healthy

  simulation-runner:
    build: .
    profiles: ["standalone"]
    command: ["python", "-m", "app.standalone_runner"]
    environment:
      ORDER_API_URL: http://order-api:8000
      INVENTORY_API_URL: http://inventory-api:8001
      SUPPLIER_API_URL: http://supplier-simulator:8002
      EVENT_COLLECTOR_URL: http://event-collector:8010
      SIMULATION_REPORT_PATH: /run-state/simulation-report.json
      SIMULATION_COLLECTOR_BARRIER_TIMEOUT_SECONDS: "30"
      SIMULATION_COLLECTOR_POLL_INITIAL_BACKOFF_SECONDS: "0.1"
      SIMULATION_COLLECTOR_POLL_MAX_BACKOFF_SECONDS: "2"
      SIMULATION_PRODUCT_ID: "7"
      SIMULATION_OPENING_STOCK: "42"
      SIMULATION_REORDER_POINT: "30"
      SIMULATION_TARGET_STOCK: "60"
      SIMULATION_LEAD_TIME_SECONDS: "3600"
      SIMULATION_FIRST_BATCH_COUNT: "8"
      SIMULATION_SECOND_BATCH_COUNT: "4"
      SIMULATION_ORDER_QUANTITY: "2"
      SIMULATION_SEED: "20261107"
    volumes:
      - run-state:/run-state
    depends_on:
      order-api:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
      supplier-simulator:
        condition: service_healthy
      event-collector:
        condition: service_healthy

  order-generator:
    build: .
    profiles: ["simulation"]
    command: ["python", "-m", "app.order_generator"]
    environment:
      ORDER_API_URL: http://order-api:8000
      EVENT_COLLECTOR_URL: http://event-collector:8010
      ORDER_GENERATOR_MODE: random
      ORDER_GENERATOR_COUNT: "10"
      ORDER_GENERATOR_SEED: "20261106"
      ORDER_GENERATOR_PRODUCT_ID: "7"
    depends_on:
      order-api:
        condition: service_healthy
      event-collector:
        condition: service_healthy

  analytics:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    profiles: ["analytics"]
    working_dir: /workspace
    environment:
      DUCKDB_PATH: /analytics-data/trace_events.duckdb
    command:
      - sh
      - -c
      - |
        if [ -s /raw/events.jsonl ]; then
          export RAW_EVENTS_PATH=/raw/events.jsonl
        fi
        dbt build --project-dir /workspace --profiles-dir /workspace
    volumes:
      - event-data:/raw:ro
      - analytics-data:/analytics-data
    depends_on:
      event-collector:
        condition: service_healthy

  analytics-runner:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    profiles: ["standalone"]
    working_dir: /workspace
    environment:
      SIMULATION_REPORT_PATH: /run-state/simulation-report.json
      RAW_EVENTS_PATH: /raw/events.jsonl
      DUCKDB_PATH: /analytics-data/trace_events.duckdb
      DBT_TARGET_PATH: /analytics-data/dbt-target
      ANALYTICS_REPORT_PATH: /analytics-data/run-report.json
      DBT_PROJECT_DIR: /workspace
      DBT_PROFILES_DIR: /workspace
      ANALYTICS_TIMEOUT_SECONDS: "3600"
    command: ["python", "/workspace/analytics_runner.py"]
    volumes:
      - event-data:/raw:ro
      - run-state:/run-state:ro
      - analytics-data:/analytics-data
    depends_on:
      event-collector:
        condition: service_healthy
      simulation-runner:
        condition: service_completed_successfully

volumes:
  postgres-data:
  event-data:
  analytics-data:
  run-state:
